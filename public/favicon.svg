<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Dark Theme Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Vibrant Cyan-to-Indigo Gradient for Code & Initials -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Tailwind Sky 400 -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- Tailwind Indigo 500 -->
    </linearGradient>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Subtle Inner Tech Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Initials, sized to stay readable at 16px -->
  <text x="32" y="44" font-family="monospace, system-ui, sans-serif" font-weight="700" font-size="34" fill="url(#accentGrad)" text-anchor="middle">MA</text>
</svg>
